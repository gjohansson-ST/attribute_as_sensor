---
name: Release Drafter

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update_release_draft:
    name: ✏️ Draft release
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # yamllint disable rule:line-length
      - name: 🔍 Read name and required Home Assistant version
        id: marketplace
        run: |
          if [ -f hacs.json ]; then
            echo "name=$(jq -r .name custom_components/*/manifest.json)" >> "$GITHUB_OUTPUT"
            {
              echo "homeassistant<<EOF"
              echo "## Required HA version"
              echo "**$(jq -r .homeassistant hacs.json)**"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            name=$(python3 -c 'import tomllib; d = tomllib.load(open("pyproject.toml", "rb")); print(d.get("project", {}).get("name") or d["tool"]["poetry"]["name"])')
            echo "name=${name}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Run Release Drafter
        uses: release-drafter/release-drafter@v7.10.0
        with:
          header: |+
            > 💙 **Enjoying ${{ steps.marketplace.outputs.name }}?** Give it a ⭐ on [GitHub](${{ github.server_url }}/${{ github.repository }}) or [become a sponsor](${{ github.server_url }}/sponsors/${{ github.repository_owner }}) to help keep the updates coming!

            ${{ steps.marketplace.outputs.homeassistant }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
